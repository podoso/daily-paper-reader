github:
  owner: ''
  repo: daily-paper-reader
arxiv_paper_setting:
  mode: standard
  days_window: 9
  docs_dir: docs
  prefer_supabase_read: true
supabase:
  enabled: true
  url: https://lyucdwgefyfbmaiopjbk.supabase.co
  anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
  papers_table: arxiv_papers
  use_vector_rpc: true
  vector_rpc: match_arxiv_papers
  vector_rpc_ann: match_arxiv_papers
  vector_rpc_exact: match_arxiv_papers_exact
  use_bm25_rpc: true
  bm25_rpc: match_arxiv_papers_bm25
  sync_table: arxiv_sync_status
  sync_success_value: success
  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: "大型语言模型"
      description: "Large Language Models (LLM) — 大语言模型相关论文"
      enabled: true
      paper_sources:
        - arxiv
        - icml
        - neurips
        - iclr
      keywords:
        - keyword: "large language model"
          query: "large language model"
        - keyword: "LLM"
          query: "LLM"
        - keyword: "transformer"
          query: "transformer architecture"
        - keyword: "instruction tuning"
          query: "instruction tuning"
        - keyword: "RLHF"
          query: "reinforcement learning from human feedback"
      intent_queries:
        - query: "Efficient fine-tuning methods for large language models"
        - query: "Chain of thought reasoning in LLMs"
        - query: "Alignment and safety of language models"
    - tag: "多模态学习"
      description: "Multimodal Learning — 多模态学习与视觉语言模型"
      enabled: true
      paper_sources:
        - arxiv
        - icml
        - neurips
        - cvpr
      keywords:
        - keyword: "multimodal"
          query: "multimodal"
        - keyword: "vision language model"
          query: "vision language model"
        - keyword: "VLM"
          query: "VLM"
        - keyword: "image captioning"
          query: "image captioning"
        - keyword: "visual question answering"
          query: "visual question answering"
      intent_queries:
        - query: "Vision-language pre-training and transfer learning"
